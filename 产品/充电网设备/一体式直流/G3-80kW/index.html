<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>G3-80kW 一体式直流充电机 | 特来电</title>
<script>
function deviceFolder() {
  const mobile = /mobile|android|iphone|ipod|phone|ipad/i.test(navigator.userAgent);
  return window.innerWidth >= 768 && !mobile ? 'PC' : '移动端';
}
const target = new URL(deviceFolder() + '/index.html', location.href);
target.search = location.search;
target.searchParams.set('adaptive', '1');
target.hash = location.hash;
location.replace(target);
</script>
</head>
<body class="body-class">
<a href="PC/index.html">PC 版</a> · <a href="移动端/index.html">移动版</a>
</body>
</html>
